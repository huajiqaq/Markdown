name: Test

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
    types: [ opened, synchronize, reopened, ready_for_review ]
  workflow_dispatch:

jobs:
  jvm-test:
    name: JVM Tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Run all JVM tests
        run: ./gradlew jvmTest

      - name: Compile parser tests for JS and Wasm
        run: ./gradlew :markdown-parser:compileTestKotlinJs :markdown-parser:compileTestKotlinWasmJs

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jvm-test-reports
          path: |
            **/build/reports/tests/jvmTest/**
            **/build/test-results/jvmTest/**

  performance-gate:
    name: JVM Performance Gate
    runs-on: ubuntu-latest

    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: 21
          cache: 'gradle'

      - name: Grant execute permission for Gradle
        run: chmod +x ./gradlew

      - name: Check parser performance budgets
        run: ./gradlew :markdown-benchmark:performanceGate

      - name: Upload benchmark report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-performance-report
          path: markdown-benchmark/build/reports/performance-gate/results.json
